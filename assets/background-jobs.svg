<svg xmlns="http://www.w3.org/2000/svg" width="960" height="476" viewBox="0 0 960 476" role="img" aria-labelledby="t d">
  <title id="t">Reliable background jobs</title>
  <desc id="d">Client sends a job with an idempotency key to a Django REST API, which stores the job in PostgreSQL and enqueues it on AWS SQS. An ECS worker claims a lease with heartbeats, writes in atomic transactions with row-level locks, exports to S3 and retries failed jobs. Errors go to Sentry and CloudWatch.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2d3a"/>
      <stop offset="1" stop-color="#21222c"/>
    </linearGradient>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8f93b8"/>
    </marker>
    <marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ff79c6"/>
    </marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <style>
      text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
      .h { font-size: 16px; font-weight: 700; fill: #f8f8f2; }
      .s { font-size: 12.5px; fill: #a4a8c8; }
      .lbl { font-size: 12px; fill: #a4a8c8; }
      .title { font-size: 20px; font-weight: 700; fill: #f8f8f2; }
      .sub { font-size: 13px; fill: #6272a4; }
      .card { fill: #343746; stroke: #44475a; stroke-width: 1; }
      .edge { stroke: #8f93b8; stroke-width: 2; fill: none; }
      .badge { font-size: 12px; font-weight: 700; fill: #21222c; }
      .lh { font-size: 14px; font-weight: 700; fill: #f8f8f2; }
      .lt { font-size: 12.5px; fill: #a4a8c8; }
    </style>
  </defs>

  <rect width="960" height="476" rx="16" fill="url(#bg)"/>

  <!-- heading -->
  <text x="30" y="40" class="title">Reliable background jobs</text>
  <text x="30" y="62" class="sub">imports · cost recalculation · exports</text>

  <!-- retry loop: worker back to queue -->
  <path d="M800 96 C800 46, 625 46, 625 92" stroke="#ff79c6" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#ahp)"/>
  <text x="712" y="44" text-anchor="middle" class="lbl" fill="#ff79c6" style="fill:#ff79c6">retry · release lease</text>

  <!-- row 1 cards -->
  <g filter="url(#sh)">
    <rect x="30" y="96" width="190" height="76" rx="12" class="card"/>
    <rect x="265" y="96" width="190" height="76" rx="12" class="card"/>
    <rect x="500" y="96" width="190" height="76" rx="12" class="card"/>
    <rect x="735" y="96" width="190" height="76" rx="12" class="card"/>
  </g>
  <rect x="30" y="108" width="4" height="52" rx="2" fill="#8be9fd"/>
  <rect x="265" y="108" width="4" height="52" rx="2" fill="#50fa7b"/>
  <rect x="500" y="108" width="4" height="52" rx="2" fill="#ffb86c"/>
  <rect x="735" y="108" width="4" height="52" rx="2" fill="#ff79c6"/>

  <text x="48" y="128" class="h">Client / Admin UI</text>
  <text x="48" y="150" class="s">React · TypeScript</text>
  <text x="283" y="128" class="h">Django REST API</text>
  <text x="283" y="150" class="s">validate · create job</text>
  <text x="518" y="128" class="h">AWS SQS</text>
  <text x="518" y="150" class="s">job queue</text>
  <text x="753" y="128" class="h">ECS Worker</text>
  <text x="753" y="150" class="s">long-running jobs</text>

  <!-- row 1 edges -->
  <line x1="222" y1="134" x2="261" y2="134" class="edge" marker-end="url(#ah)"/>
  <line x1="457" y1="134" x2="496" y2="134" class="edge" marker-end="url(#ah)"/>
  <line x1="692" y1="134" x2="731" y2="134" class="edge" marker-end="url(#ah)"/>
  <circle cx="241" cy="134" r="11" fill="#8be9fd"/>
  <text x="241" y="138.5" text-anchor="middle" class="badge">1</text>

  <!-- row 2 cards -->
  <g filter="url(#sh)">
    <rect x="30" y="250" width="190" height="76" rx="12" class="card" stroke-dasharray="5 4"/>
    <rect x="265" y="250" width="425" height="76" rx="12" class="card"/>
    <rect x="735" y="250" width="190" height="76" rx="12" class="card"/>
  </g>
  <rect x="30" y="262" width="4" height="52" rx="2" fill="#ff5555"/>
  <rect x="265" y="262" width="4" height="52" rx="2" fill="#bd93f9"/>
  <rect x="735" y="262" width="4" height="52" rx="2" fill="#f1fa8c"/>

  <text x="48" y="282" class="h">Sentry + CloudWatch</text>
  <text x="48" y="304" class="s">errors · logs · incidents</text>
  <text x="283" y="282" class="h">PostgreSQL</text>
  <text x="283" y="304" class="s">jobs · ledgers · stock · atomic tx + row-level locks</text>
  <circle cx="666" cy="276" r="11" fill="#bd93f9"/>
  <text x="666" y="280.5" text-anchor="middle" class="badge">3</text>
  <text x="753" y="282" class="h">Amazon S3</text>
  <text x="753" y="304" class="s">exports · presigned URLs</text>

  <!-- row 2 edges -->
  <line x1="340" y1="174" x2="340" y2="246" class="edge" marker-end="url(#ah)"/>
  <text x="350" y="216" class="lbl">insert job row</text>

  <path d="M775 174 L775 211 L640 211 L640 246" class="edge" marker-end="url(#ah)"/>
  <text x="755" y="203" text-anchor="end" class="lbl">lease · heartbeat · batched COPY</text>
  <circle cx="775" cy="211" r="11" fill="#ff79c6"/>
  <text x="775" y="215.5" text-anchor="middle" class="badge">2</text>

  <line x1="885" y1="174" x2="885" y2="246" class="edge" marker-end="url(#ah)"/>
  <text x="893" y="216" class="lbl">export</text>

  <path d="M290 174 L290 196 Q290 206 280 206 L135 206 Q125 206 125 216 L125 246" stroke="#ff5555" stroke-width="1.6" stroke-dasharray="4 4" fill="none"/>
  <text x="140" y="198" class="lbl">errors · logs</text>

  <!-- legend -->
  <line x1="30" y1="352" x2="925" y2="352" stroke="#44475a" stroke-width="1"/>

  <circle cx="44" cy="382" r="11" fill="#8be9fd"/>
  <text x="44" y="386.5" text-anchor="middle" class="badge">1</text>
  <text x="64" y="387" class="lh">Idempotency key</text>
  <text x="64" y="410" class="lt">A retried request never</text>
  <text x="64" y="428" class="lt">creates a second job.</text>

  <circle cx="349" cy="382" r="11" fill="#ff79c6"/>
  <text x="349" y="386.5" text-anchor="middle" class="badge">2</text>
  <text x="369" y="387" class="lh">Lease + heartbeat</text>
  <text x="369" y="410" class="lt">A crashed worker's job is picked</text>
  <text x="369" y="428" class="lt">up again, never processed twice.</text>

  <circle cx="654" cy="382" r="11" fill="#bd93f9"/>
  <text x="654" y="386.5" text-anchor="middle" class="badge">3</text>
  <text x="674" y="387" class="lh">Atomic tx + row-level locks</text>
  <text x="674" y="410" class="lt">Stock and ledger stay consistent,</text>
  <text x="674" y="428" class="lt">even under concurrent edits.</text>
</svg>
